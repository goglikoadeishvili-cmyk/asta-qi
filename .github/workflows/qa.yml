name: ASTA QI quality checks

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - main
      - 'fix/**'

permissions:
  contents: write

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Check types
        run: npm run check
      - name: Run tests
        run: timeout 35s npm test
      - name: Build deployable site
        run: PAGES_BASE_PATH=/asta-qi/ npm run build
      - name: Verify publish output
        run: npm run publish:assets
      - name: Commit compiled web assets on main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A assets index.html sw.js
          if ! git diff --cached --quiet; then
            git commit -m 'Publish verified ASTA QI web assets'
            git push origin HEAD:main
          fi
